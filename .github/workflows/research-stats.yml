# Recompute the paper's statistics from the per-company outputs of an earlier `research` run, with the current code.
name: research-stats
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "ID of the research run whose shard outputs to use", required: true }
permissions: { contents: read, actions: read }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Download the shard outputs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n research-results -D /tmp/rr && mkdir -p .cache && cp -r /tmp/rr/engine/.cache/research .cache/
      - run: uv sync && uv run python -m fintwin.research stats
      - uses: actions/upload-artifact@v4
        with: { name: research-stats, path: docs/paper/research.json }
